# =============================================================================
# 本地开发依赖栈：MySQL + Redis + RocketMQ + Nacos
# 生产请使用云托管或 K8s Helm（bitnami/rocketmq、nacos/nacos、bitnami/mysql 等）
#   docker compose up -d
# 注意：首次启动后请在 Nacos 中导入 deploy/nacos/*.yaml 配置。
# =============================================================================
services:
  mysql:
    image: mysql:8.0
    container_name: wa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: wa_gateway
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: wa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: wa-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: wa-rmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: wa-rmq-broker
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
      AUTO_CREATE_TOPIC_ENABLE: "true"   # 生产环境建议预建主题并关闭自动建主题
    command: sh mqbroker -n rocketmq-namesrv:9876
    ports:
      - "10909:10909"
      - "10911:10911"

volumes:
  mysql-data:
  redis-data: