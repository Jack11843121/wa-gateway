# 非敏感配置（敏感值放 02-secret.yaml，勿提交明文密码）
apiVersion: v1
kind: ConfigMap
metadata:
  name: wa-gateway-config
  namespace: wa-gateway
data:
  SPRING_PROFILES_ACTIVE: "prod"
  NACOS_GROUP: "wa-gateway"
  NACOS_SERVER_ADDR: "nacos.nacos:8848"      # 替换为你的 Nacos 地址
  GRAPH_BASE_URL: "https://graph.facebook.com"
  GRAPH_VERSION: "v20.0"
  ROCKETMQ_NAME_SERVER: "rocketmq-namesrv:9876"
  ROCKETMQ_PRODUCER_GROUP: "WA_GATEWAY_PRODUCER"