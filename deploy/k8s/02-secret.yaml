# 敏感配置（生产请改用 KMS/SealedSecret/ExternalSecret 管理）
apiVersion: v1
kind: Secret
metadata:
  name: wa-gateway-secret
  namespace: wa-gateway
type: Opaque
stringData:
  GATEWAY_API_KEY: "change-me-admin-key"
  TOKEN_ENCRYPT_SECRET: "change-me-32-char-encrypt-secret"
  NACOS_USERNAME: "nacos"
  NACOS_PASSWORD: "nacos"
  # 若 MySQL/Redis/RocketMQ 不使用 Nacos 下发，可在此注入（优先级低于 Nacos 配置）
  MYSQL_URL: "jdbc:mysql://mysql:3306/wa_gateway?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC"
  MYSQL_USER: "root"
  MYSQL_PASSWORD: "root123"
  REDIS_HOST: "redis"
  REDIS_PASSWORD: ""